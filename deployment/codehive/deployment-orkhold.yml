# Traefik de codehive: la API de Orkhold en https://app.orkhold.com (02-arquitectura.md §5).
# El servidor de mundo no pasa por aquí: va directo por UDP 7777.
http:
  routers:
    deploy-orkhold:
      rule: Host(`app.orkhold.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: deploy-orkhold

  services:
    deploy-orkhold:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:4152
