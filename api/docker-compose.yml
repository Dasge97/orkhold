# Desarrollo local: PostgreSQL 16 + API. Puertos 5442 y 3100 (3000 y 5432 los usa WSL en este PC).
# Los secretos salen de api/.env (no va en git).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orkhold
      POSTGRES_USER: orkhold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en api/.env}
    ports: ["5442:5432"]
    volumes:
      - datos:/var/lib/postgresql/data
      - ./sql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orkhold"]
      interval: 2s
      retries: 30
  api:
    build: .
    environment:
      BD_URL: postgres://orkhold:${POSTGRES_PASSWORD}@postgres:5432/orkhold
      BD_URL_PRUEBAS: postgres://orkhold:${POSTGRES_PASSWORD}@postgres:5432/orkhold_pruebas
      API_SECRETO: ${API_SECRETO:?falta API_SECRETO en api/.env}
      CLAVE_SERVIDOR: ${CLAVE_SERVIDOR:?falta CLAVE_SERVIDOR en api/.env}
      PUEBLO_CLIENTE: "1"
      PRUEBAS: "1"
    ports: ["3100:3000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  datos:
